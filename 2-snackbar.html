<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Promises</title>
    <script type="module" crossorigin src="/finconsultsm/2-snackbar.js"></script>
    <link rel="modulepreload" crossorigin href="/finconsultsm/assets/modulepreload-polyfill-B5Qt9EMX.js">

  <body>
    <main>
      <section class="section">
        <div class="container page">
          <a class="back-link" href="./index.html">← Go back</a>

          <h1 class="page-title">Створення промісу</h1>

          <form class="form" id="promise-form">
            <label class="form-field">
              <span class="form-label">Delay (ms)</span>
              <input
                type="number"
                name="delay"
                required
                class="form-input"
                placeholder="Наприклад 2000"
              />
            </label>

            <fieldset class="form-fieldset">
              <legend class="form-legend">State</legend>

              <label class="form-radio">
                <input type="radio" name="state" value="fulfilled" required />
                <span>Fulfilled</span>
              </label>

              <label class="form-radio">
                <input type="radio" name="state" value="rejected" required />
                <span>Rejected</span>
              </label>
            </fieldset>

            <button type="submit" class="form-button">
              Create notification
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
  <div class="container">
    <p class="footer-desc">

        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT team
      </a>
    </p>
  </div>
</footer>

  </body>
</html>
