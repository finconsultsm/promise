<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-timer</title>
    <script type="module" crossorigin src="/finconsultsm/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/finconsultsm/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/finconsultsm/assets/vendor-BbbuE1sJ.js">
    <link rel="stylesheet" crossorigin href="/finconsultsm/assets/vendor-CZjNVMTf.css">
    <link rel="stylesheet" crossorigin href="/finconsultsm/assets/styles-DyuQ_n9q.css">
  </head>
  <body>
    <p><a href="./index.html">Повернутись на головну</a></p>

    <input type="text" id="datetime-picker" />
    <button type="button" class="form-button" data-start>Start</button>

    <div class="timer">
      <div class="field">
        <span class="value" data-days>00</span>
        <span class="label">Days</span>
      </div>
      <div class="field">
        <span class="value" data-hours>00</span>
        <span class="label">Hours</span>
      </div>
      <div class="field">
        <span class="value" data-minutes>00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="field">
        <span class="value" data-seconds>00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </body>
</html>
